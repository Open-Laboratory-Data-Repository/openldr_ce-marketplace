* {
  border-color: var(--openldr-border);
}
body {
  margin: 0;
  color: var(--openldr-text);
  background: var(--openldr-bg);
  font: 14px/1.5 var(--openldr-font, system-ui);
}
button {
  cursor: pointer;
}
input[type="number"] {
  appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
button:disabled {
  cursor: default;
}
.mast, .navlist, .workspace {
  padding-inline: clamp(14px, 3vw, 44px);
}
.mast {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 24px 19px;
}
.identity, .linehead, .historytitle {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brandmark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: var(--openldr-primary-soft);
  border: 1px solid var(--openldr-primary);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in srgb, var(--openldr-primary) 37%, transparent);
  }
  border-radius: 10px;
  color: var(--openldr-text);
}
.brandlabel {
  font: 600 9px/1.4 var(--openldr-mono, monospace);
  letter-spacing: 0.13em;
  color: var(--openldr-text-muted);
}
h1 {
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 1.2;
}
h2 {
  font-size: 18px;
  letter-spacing: -0.025em;
  font-weight: 600;
}
h3 {
  font-size: 14px;
  font-weight: 600;
}
.navlist {
  display: flex;
  width: 100%;
  height: auto;
}
.navlist button {
  gap: 7px;
  padding: 10px 12px;
}
.workspace {
  padding-block: 22px 32px;
}
.counters {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--openldr-border);
  border-radius: 9px;
  background: var(--openldr-border);
  margin-bottom: 24px;
}
.counter {
  height: auto;
  min-height: 95px;
  border-radius: 0;
  background: var(--openldr-surface);
  display: grid;
  grid-template-columns: 1fr auto;
  align-content: center;
  justify-items: start;
  gap: 6px;
  padding: 14px 15px;
  white-space: normal;
  text-align: left;
  color: var(--openldr-text);
}
.counter strong {
  grid-row: 1;
  grid-column: 1;
  font-size: 27px;
  letter-spacing: -0.05em;
  font-weight: 550;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.counter > span:last-child {
  grid-column: 1/-1;
  font-size: 12px;
  color: var(--openldr-text-muted);
}
.tile-icon {
  grid-row: 1;
  grid-column: 2;
  color: var(--tone, var(--openldr-primary));
  align-self: center;
}
.counter.chosen {
  box-shadow: inset 0 -3px var(--tone, var(--openldr-primary));
  background: var(--openldr-primary-soft);
}
.held {
  --tone: var(--openldr-warning);
}
.completed {
  --tone: var(--openldr-success);
}
.ordered {
  --tone: var(--openldr-text-muted);
}
.handoff {
  --tone: var(--openldr-primary);
}
.ledger {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid var(--openldr-border);
  border-radius: 9px;
  overflow: hidden;
  background: var(--openldr-bg);
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 20px;
}
.toolbar p, small, .muted, .facts dt, .history span {
  color: var(--openldr-text-muted);
}
.toolbar p {
  font-size: 12px;
  margin-top: 3px;
}
.linehead svg {
  color: var(--openldr-text-muted);
}
.count {
  font: 12px var(--openldr-mono, monospace);
  background: var(--openldr-surface);
  border: 1px solid var(--openldr-border);
  border-radius: 5px;
  padding: 2px 7px;
}
.searchbox {
  position: relative;
  max-width: 100%;
  width: 200px;
}
.searchbox svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--openldr-text-muted);
}
.searchbox input {
  padding-left: 32px;
}
thead {
  background: var(--openldr-surface-2);
}
td {
  overflow-wrap: anywhere;
}
td small, .history span, .mobileassay {
  display: block;
  font-size: 11px;
  margin-top: 3px;
}
.rowlink {
  font-weight: 550;
  height: auto;
  padding: 0;
  text-align: left;
  white-space: normal;
  color: var(--openldr-text);
}
.accession {
  font-family: var(--openldr-mono, monospace);
}
.mobileassay {
  display: none;
}
.flag {
  white-space: nowrap;
  border-radius: 20px;
  gap: 6px;
  padding: 3px 8px;
  background: var(--openldr-surface);
  font-size: 11px;
}
.flag i {
  height: 6px;
  width: 6px;
  border-radius: 50%;
  background: var(--tone, var(--openldr-primary));
}
.actioncell {
  text-align: right;
  width: 44px;
  padding-inline: 5px 12px;
}
.benchsheet {
  --sheet-inset: 1.5rem;
  --sheet-gap: 1rem;
  gap: var(--sheet-gap);
  padding: var(--sheet-inset);
  width: 29rem;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.benchsheet > .panelhead {
  order: -1;
}
.panelhead {
  gap: 2px;
  padding-inline-end: 2.5rem;
  min-height: 2rem;
}
.panelhead h2 {
  min-width: 0;
  font-size: 20px;
  line-height: 1.3;
}
.sheet-tools {
  position: absolute;
  top: 1rem;
  right: 1rem;
}
.fields, .facts {
  display: grid;
  grid-template-columns: fit-content(45%) minmax(0, 1fr);
  gap: 14px 16px;
  align-items: baseline;

Use the laboratory desks to follow a patient, requisition, specimen and issued report. The top-right menu follows the selected tab. Reception offers registration, ordering and walk-in receipt. Open a record for actions on that patient, test or report.

## Check in a patient

1. In Reception, enter the exact patient identifier and choose Find patient.
2. Open a match and check the name and birth date. If there is no match, choose Register patient from Actions.
3. Enter the facility, identifier, name and birth date. Choose Register patient in the sheet menu.
4. From the patient's sheet, choose Create order.

## Order and receive tests

1. Scan the accession. Select the ordering facility and each requested test. To remove a selected test, click its row.
2. Enter the requester and mark urgent orders. Choose Create order. The requisition shows all requested tests.
3. Open a test. Confirm the specimen label and type. Record the collection time if known. Choose Receive specimen.
4. For an exception, enter the reason. Use Return to site for paperwork or Reject specimen for a collection problem. Receive redraw links a new label to the rejected test.

## Enter and review results

1. Open a received test in Result entry and choose Start work. Use the section filter to find your bench.
2. Enter the results and choose Save draft or Submit result for review.
3. Open Review as a different operator. Choose Accept result or enter a reason and choose Return for correction.
4. Choose Issue report to CE. A CE account with unrestricted facility access handles delivery. A failed send stays in Review.

For a numeric test, check the patient\u2019s matched reference interval. You can select another catalog interval that applies. Review shows the saved interval and its comparison with the measurement. If the catalog changes after submission, return the result and submit it again.

## Read or amend a report

1. Open Reports and select the issued edition. Download report saves a text copy.
2. To correct a released result, open its test record, enter the reason and choose Amend report.
3. Submit the corrected values for independent review and issue the next edition. The original is marked superseded.

## Record quality checks

1. In Quality, choose Add quality program. Select the test, facility and control lot or proficiency sample. Enter its assigned unit and limits.
2. Open the program, enter a measurement and choose Record measurement.
3. Open an out-of-limit reading to record the corrective action. The run history keeps the measurement and resolution.

Reception searches for an exact patient ID. Scan or type the ID, then press Enter or use the search button. Choose a match to open the patient record. Queues shows arrival stages and shortcuts to testing and review. Use Filter to narrow arrivals by accession, test, facility or section.

## Release or reject a specimen

Under Settings, enable automatic release for eligible submissions. The default is off. The CE test must allow release without verification. Critical results, amendments and transcribed referrals need review. Under Reception, use Reject without redraw for a final rejection. Review \u2192 Final rejections lists deliveries awaiting an unrestricted operator. Open the item to send it to CE.

## Refer a test and receive the result

Open a received test, choose Refer to another lab and enter the destination and tracking reference. Use Referrals to record receipt or exchange the referral file. The receiving lab selects its local patient and test. It can return the issued edition to the sender. Verify the transcription locally before release.

## Run proficiency assessments and review control lots

In Quality, use the register selector to open Proficiency schemes. Enrol the scheme, register a cycle, add its tests and record results. Record review, submission receipt and provider feedback. Document corrective action for an unsatisfactory result before closure. Open an internal control lot to see its measurements against the lab's target and standard deviation.

## Work with files

In Result entry, open a claimed test and export its offline worksheet. Open the worksheet in Laboratory files. Save the completed file, then import it into the same test in Studio. Inspect the preview and save the draft. A change to the test revision requires a fresh export. The same import accepts one final HL7 ORU result file. In Reports, export a printable edition and open it in Laboratory files to print or save a PDF. Use Lab activity report for totals by date and test.

## Find and open a record

When the tabs no longer fit, use the department selector above the toolbar. Your current department stays selected.

The \u22EF beside a sheet title contains its actions and Close. You can also press Escape or click outside the sheet.

Click anywhere in a register row to open its sheet. With the keyboard, focus the record name and press Enter. The \u22EF menu also opens the record.

In Patients, search by name or ID. Use Filter for an exact identifier. Orders searches requisition numbers and filters by ordering site, requester or priority. In Result entry, scan a specimen label. The order accession is available under Filter. Review searches the accession and filters by test, last handler, section or priority. Switch to Final rejections to see pending rejection deliveries.

Reports searches issued accessions. Filter editions by signer, test or whether the edition is current. In Quality, select the register before searching for a lot, program or scheme. Referrals searches the referring accession and shows the reference lab and tracking number. The test catalog searches test names and codes and filters by section or LOINC mapping.

In Settings, choose the performing lab by facility name or code. Add or edit a list entry through its menu, then choose Save settings. Turning an entry off keeps earlier records readable. For a return, amendment, referral or corrective action, select a code and description. An entry such as Other asks for an explanation.

When linking a patient, choose Patient to open the picker. With browse access, search by name or identifier, or page through the list. With find access only, submit an exact identifier. Check the patient details before linking. To undo a reason before saving, open the reason list and choose Clear selection. This also clears its explanation.

## Open an issued laboratory edition

1. In Laboratory, open Reports. Find the accession and select the edition you want to read.
2. Choose **Open edition \u2026 in CE Reports**. Check the edition number, issue time and reported values. **Earlier version** means CE holds a later version of the report.
3. Choose **Back to lab report** to return to that edition. If CE says the edition is unavailable, you can still read the laboratory\u2019s issued copy in the sheet.

Les postes de travail relient le patient, la demande, le pr\xE9l\xE8vement et le compte rendu. Le menu en haut \xE0 droite d\xE9pend de l\u2019onglet. \xC0 la r\xE9ception, il permet d\u2019inscrire un patient, de cr\xE9er une demande ou de recevoir un pr\xE9l\xE8vement. Ouvrez un dossier pour agir sur ce patient, cette analyse ou ce compte rendu.

## Accueillir un patient

1. Dans Reception, recherchez l'identifiant exact. V\xE9rifiez le nom et la date de naissance.
2. Si le patient est absent, choisissez Register patient. Saisissez le nom, la date de naissance, l'\xE9tablissement et l'identifiant.
3. Enregistrez le patient puis choisissez Create order dans son dossier.

## Demander et recevoir les analyses

1. Scannez le num\xE9ro de demande. S\xE9lectionnez l'\xE9tablissement et toutes les analyses demand\xE9es. Indiquez le prescripteur et l'urgence. Pour retirer une analyse s\xE9lectionn\xE9e, cliquez sur sa ligne.
2. Choisissez Create order puis ouvrez une analyse. V\xE9rifiez l'\xE9tiquette et le type de pr\xE9l\xE8vement. Indiquez l'heure de collecte si elle est connue.
3. Choisissez Receive specimen. Pour renvoyer une demande, indiquez le motif puis choisissez Return to site. Reject specimen permet de demander un nouveau pr\xE9l\xE8vement.

## Saisir, v\xE9rifier et publier

1. Dans Result entry, ouvrez l'analyse puis choisissez Start work. Saisissez les r\xE9sultats et choisissez Save draft ou Submit result for review.
2. Un autre op\xE9rateur ouvre Review. Il peut choisir Accept result ou Return for correction avec un motif.
3. Choisissez Issue report to CE avec un compte autoris\xE9 pour tous les \xE9tablissements. Dans Reports, Download report enregistre le compte rendu.
4. Pour corriger un compte rendu, ouvrez l'analyse, indiquez le motif puis choisissez Amend report. La nouvelle \xE9dition doit aussi \xEAtre v\xE9rifi\xE9e.

Pour un test num\xE9rique, v\xE9rifiez l\u2019intervalle de r\xE9f\xE9rence du patient. Si n\xE9cessaire, choisissez un autre intervalle applicable du catalogue. La r\xE9vision affiche l\u2019intervalle enregistr\xE9 et la comparaison avec la mesure. Si le catalogue change apr\xE8s la soumission, renvoyez le r\xE9sultat pour une nouvelle saisie.

## Suivre la qualit\xE9

1. Dans Quality, cr\xE9ez un lot de contr\xF4le ou un \xE9chantillon d'\xE9valuation externe avec Add quality program.
2. Saisissez les limites attribu\xE9es, l'unit\xE9 et la mesure. Choisissez Record measurement.
3. Pour une mesure hors limites, consignez l'action corrective dans l'historique.

Dans Reception, scannez ou saisissez l\u2019identifiant exact du patient et appuyez sur Entr\xE9e. Ouvrez le patient dans les r\xE9sultats. Queues donne acc\xE8s aux arriv\xE9es, aux analyses et \xE0 la v\xE9rification.

## Publication automatique et rejet d\xE9finitif

Dans Settings, activez la publication automatique si la politique du laboratoire le permet. Elle est d\xE9sactiv\xE9e par d\xE9faut. L\u2019analyse doit aussi permettre la publication sans v\xE9rification dans CE. Les valeurs critiques, les corrections et les r\xE9sultats transcrits apr\xE8s transfert passent en r\xE9vision. Dans Reception, Reject without redraw enregistre un rejet d\xE9finitif. Un op\xE9rateur autoris\xE9 pour tous les sites peut relancer l\u2019envoi dans Review \u2192 Final rejections.

## Transferts et qualit\xE9

Ouvrez une analyse re\xE7ue et indiquez le laboratoire destinataire et la r\xE9f\xE9rence de suivi. Dans Referrals, confirmez la r\xE9ception ou \xE9changez le fichier de transfert. Le destinataire choisit le patient et l\u2019analyse dans son propre catalogue. Il renvoie l\u2019\xE9dition publi\xE9e. V\xE9rifiez la transcription avant de publier le r\xE9sultat localement.

Dans Quality, ouvrez Proficiency schemes. Inscrivez le programme, cr\xE9ez un cycle, ajoutez les analyses puis enregistrez les r\xE9sultats. Consignez la v\xE9rification, l\u2019accus\xE9 de r\xE9ception et les r\xE9sultats du fournisseur. Documentez les actions correctives avant de cl\xF4turer le cycle. Pour un lot de contr\xF4le, ouvrez la courbe des mesures et les alertes selon la moyenne et l\u2019\xE9cart type attribu\xE9s.

## Fichiers et rapports

Dans Result entry, exportez la feuille de travail du pr\xE9l\xE8vement que vous avez pris en charge. Compl\xE9tez-la dans Laboratory files. R\xE9importez le fichier dans la m\xEAme analyse, v\xE9rifiez l\u2019aper\xE7u et enregistrez le brouillon. Si la r\xE9vision a chang\xE9, exportez une nouvelle feuille. Cet \xE9cran accepte aussi un fichier de r\xE9sultats HL7 ORU final. Dans Reports, exportez une \xE9dition et ouvrez-la dans Laboratory files pour imprimer ou enregistrer le PDF. Lab activity report exporte les volumes et d\xE9lais par analyse et p\xE9riode.

## Rechercher et ouvrir un dossier

Quand la fen\xEAtre r\xE9tr\xE9cit, utilisez le s\xE9lecteur de service au-dessus de la barre d\u2019outils. Le service actuel reste s\xE9lectionn\xE9.

Le menu \u22EF \xE0 c\xF4t\xE9 du titre de la fiche contient les actions et Close. Vous pouvez aussi appuyer sur \xC9chap ou cliquer en dehors de la fiche.

Cliquez sur la ligne pour ouvrir la fiche. Au clavier, placez le focus sur le nom et appuyez sur Entr\xE9e. Le menu \u22EF reste accessible s\xE9par\xE9ment.

Dans Patients, recherchez le nom ou l\u2019identifiant. Orders recherche le num\xE9ro de demande. Dans Result entry, scannez l\u2019\xE9tiquette du pr\xE9l\xE8vement ou filtrez par num\xE9ro de demande. Review recherche le num\xE9ro de demande et permet de filtrer par analyse, op\xE9rateur, section ou priorit\xE9. Reports distingue les \xE9ditions actuelles des \xE9ditions remplac\xE9es. Quality recherche le lot ou le programme s\xE9lectionn\xE9. Referrals affiche le laboratoire destinataire et la r\xE9f\xE9rence de suivi. Test catalog recherche le nom ou le code de l\u2019analyse.

Dans Settings, cherchez le laboratoire ex\xE9cutant par nom ou code. Ajoutez ou modifiez une entr\xE9e dans le menu de la liste, puis choisissez Save settings. D\xE9sactiver une entr\xE9e conserve les dossiers ant\xE9rieurs. Pour un retour, une modification, un transfert ou une action corrective, s\xE9lectionnez un code et sa description. Une entr\xE9e telle que Autre demande une explication.

Pour associer un patient, ouvrez le s\xE9lecteur Patient. Si vous avez acc\xE8s \xE0 la liste, recherchez un nom ou un identifiant, ou parcourez les pages. Avec le droit de recherche exacte seul, saisissez un identifiant complet et lancez la recherche. V\xE9rifiez les coordonn\xE9es du patient avant de l\u2019associer. Pour retirer un motif avant l\u2019enregistrement, choisissez Clear selection dans la liste. Son explication sera aussi effac\xE9e.

## Ouvrir une \xE9dition du compte rendu de laboratoire

1. Dans Laboratoire, ouvrez Rapports. Recherchez le num\xE9ro de demande et s\xE9lectionnez l\u2019\xE9dition \xE0 consulter.
2. Choisissez **Open edition \u2026 in CE Reports**. V\xE9rifiez le num\xE9ro d\u2019\xE9dition, la date d\u2019\xE9mission et les r\xE9sultats. **Version ant\xE9rieure** indique que CE poss\xE8de une version plus r\xE9cente.
3. Choisissez **Retour au compte rendu du laboratoire** pour retrouver cette \xE9dition. Si elle est indisponible dans CE, la copie \xE9mise reste consultable dans le volet du laboratoire.
`;var DP=`# Laborat\xF3rio

Os postos de trabalho ligam o paciente, a requisi\xE7\xE3o, a amostra e o relat\xF3rio emitido. O menu no canto superior direito depende do separador. Na rece\xE7\xE3o, pode registar um paciente, criar uma requisi\xE7\xE3o ou receber uma amostra. Abra o registo para atuar sobre esse paciente, teste ou relat\xF3rio.

## Receber um paciente

1. Em Reception, procure o identificador exato. Confirme o nome e a data de nascimento.
2. Se n\xE3o houver correspond\xEAncia, escolha Register patient. Indique o nome, a data de nascimento, a unidade e o identificador.
3. Guarde o paciente e escolha Create order na ficha.

## Pedir e receber an\xE1lises

1. Leia o n\xFAmero da requisi\xE7\xE3o. Selecione a unidade e todas as an\xE1lises. Indique o requisitante e a urg\xEAncia. Para remover uma an\xE1lise selecionada, clique na respetiva linha.
2. Escolha Create order e abra uma an\xE1lise. Confirme a etiqueta e o tipo de amostra. Indique a hora da colheita, se conhecida.
3. Escolha Receive specimen. Para devolver um pedido, indique o motivo e escolha Return to site. Reject specimen permite pedir nova colheita.

## Registar, rever e emitir

1. Em Result entry, abra a an\xE1lise e escolha Start work. Preencha os resultados. Escolha Save draft ou Submit result for review.
2. Outro operador abre Review. Escolhe Accept result ou indica o motivo e escolhe Return for correction.
3. Escolha Issue report to CE com uma conta autorizada para todas as unidades. Em Reports, Download report guarda uma c\xF3pia do relat\xF3rio.
4. Para corrigir um relat\xF3rio, abra a an\xE1lise, indique o motivo e escolha Amend report. A nova edi\xE7\xE3o exige revis\xE3o independente.

Para um teste num\xE9rico, confira o intervalo de refer\xEAncia do paciente. Se necess\xE1rio, selecione outro intervalo aplic\xE1vel no cat\xE1logo. A revis\xE3o mostra o intervalo salvo e a compara\xE7\xE3o com a medi\xE7\xE3o. Se o cat\xE1logo mudar ap\xF3s o envio, devolva o resultado para nova submiss\xE3o.

## Acompanhar a qualidade

1. Em Quality, crie um lote de controlo ou uma amostra de avalia\xE7\xE3o externa em Add quality program.
2. Introduza os limites atribu\xEDdos, a unidade e a medi\xE7\xE3o. Escolha Record measurement.
3. Se a medi\xE7\xE3o ficar fora dos limites, registe a a\xE7\xE3o corretiva no hist\xF3rico.

Em Reception, leia ou introduza o identificador exato do doente e prima Enter. Abra a ficha a partir do resultado. Queues permite consultar as entradas e passar para os testes ou a revis\xE3o.

## Liberta\xE7\xE3o autom\xE1tica e rejei\xE7\xE3o definitiva

Em Settings, ative a liberta\xE7\xE3o autom\xE1tica se a pol\xEDtica do laborat\xF3rio o permitir. Por predefini\xE7\xE3o est\xE1 desativada. O teste em CE tamb\xE9m tem de permitir a liberta\xE7\xE3o sem verifica\xE7\xE3o. Valores cr\xEDticos, altera\xE7\xF5es e resultados transcritos de outro laborat\xF3rio passam por revis\xE3o. Em Reception, use Reject without redraw para registar uma rejei\xE7\xE3o definitiva. Um operador com acesso a todas as unidades pode repetir o envio em Review \u2192 Final rejections.

## Encaminhamento e qualidade

Abra um teste recebido e indique o laborat\xF3rio de destino e a refer\xEAncia de seguimento. Em Referrals, confirme a rece\xE7\xE3o ou troque o ficheiro de encaminhamento. O destinat\xE1rio seleciona o doente e o teste locais e devolve a edi\xE7\xE3o publicada. Verifique a transcri\xE7\xE3o antes de publicar o resultado local.

Em Quality, selecione Proficiency schemes. Inscreva o programa, crie um ciclo, adicione os testes e registe os resultados. Registe a revis\xE3o, o comprovativo de envio e a avalia\xE7\xE3o do fornecedor. Documente as a\xE7\xF5es corretivas antes de encerrar o ciclo. Abra um lote de controlo para consultar o gr\xE1fico de medi\xE7\xF5es e os alertas relativos \xE0 m\xE9dia e ao desvio padr\xE3o atribu\xEDdos.

## Ficheiros e relat\xF3rios

Em Result entry, exporte a folha do teste que assumiu. Preencha-a em Laboratory files. Importe o ficheiro no mesmo teste, confira a pr\xE9-visualiza\xE7\xE3o e guarde o rascunho. Se a revis\xE3o tiver mudado, exporte uma nova folha. Tamb\xE9m pode importar um ficheiro de resultados finais HL7 ORU. Em Reports, exporte a edi\xE7\xE3o e abra-a em Laboratory files para imprimir ou guardar o PDF. Lab activity report exporta volumes e tempos por teste e per\xEDodo.

## Procurar e abrir um registo

Quando os separadores deixam de caber, use o seletor de departamento acima da barra de ferramentas. O departamento atual continua selecionado.

O menu \u22EF junto ao t\xEDtulo da ficha cont\xE9m as a\xE7\xF5es e Close. Tamb\xE9m pode premir Esc ou clicar fora da ficha.

Clique na linha para abrir a ficha. Com o teclado, selecione o nome e prima Enter. O menu \u22EF continua dispon\xEDvel em separado.

Em Patients, procure pelo nome ou identificador. Orders procura o n\xFAmero da requisi\xE7\xE3o. Em Result entry, leia a etiqueta da amostra ou filtre pelo n\xFAmero da requisi\xE7\xE3o. Review procura a requisi\xE7\xE3o e permite filtrar por teste, operador, sec\xE7\xE3o ou prioridade. Reports distingue as edi\xE7\xF5es atuais das substitu\xEDdas. Quality procura o lote ou programa selecionado. Referrals mostra o laborat\xF3rio de destino e a refer\xEAncia de seguimento. Test catalog procura pelo nome ou c\xF3digo do teste.

Em Settings, procure a unidade executante pelo nome ou c\xF3digo. Adicione ou edite uma entrada no menu da lista e escolha Save settings. Desativar uma entrada preserva os registos anteriores. Para uma devolu\xE7\xE3o, altera\xE7\xE3o, referencia\xE7\xE3o ou a\xE7\xE3o corretiva, selecione o c\xF3digo e a descri\xE7\xE3o. Uma entrada como Outro pede uma explica\xE7\xE3o.

Para associar um paciente, abra o seletor Patient. Se tiver acesso \xE0 lista, pesquise por nome ou identificador, ou percorra as p\xE1ginas. Se tiver apenas acesso \xE0 pesquisa exata, introduza o identificador completo e inicie a pesquisa. Confira os dados do paciente antes de o associar. Para retirar um motivo antes de guardar, escolha Clear selection na lista. A explica\xE7\xE3o tamb\xE9m ser\xE1 apagada.

## Abrir uma edi\xE7\xE3o do relat\xF3rio de laborat\xF3rio

1. No Laborat\xF3rio, abra Relat\xF3rios. Procure o n\xFAmero da requisi\xE7\xE3o e selecione a edi\xE7\xE3o que pretende consultar.
2. Selecione **Open edition \u2026 in CE Reports**. Confira o n\xFAmero da edi\xE7\xE3o, a data de emiss\xE3o e os resultados. **Vers\xE3o anterior** indica que existe uma vers\xE3o mais recente no CE.
3. Selecione **Voltar ao relat\xF3rio do laborat\xF3rio** para regressar \xE0 mesma edi\xE7\xE3o. Se a edi\xE7\xE3o estiver indispon\xEDvel no CE, a c\xF3pia emitida continua dispon\xEDvel no painel do laborat\xF3rio.
